<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Month</title>
    <link rel="stylesheet" href="months.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Floating Back Button -->
    <a href="overview.html" class="floating-back-btn">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

    <main class="dashboard">
        <!-- Header Section -->
        <header class="header-section">
            <h1 class="page-title">SELECT MONTH</h1>
        </header>

        <!-- Year Selector -->
        <section class="year-selector-section">
            <div class="year-dropdown-container">
                <label for="year-select" class="year-label">Year:</label>
                <select id="year-select" class="year-dropdown">
                    <option value="2026" selected>2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                    <option value="2020">2020</option>
                </select>
            </div>
        </section>

        <!-- Months Grid -->
        <section class="months-grid-section">
            <div class="months-grid">
                <a href="overview.html" class="month-card">
                    <span class="month-name">January</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="overview.html" class="month-card">
                    <span class="month-name">February</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="overview.html" class="month-card">
                    <span class="month-name">March</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="overview.html" class="month-card">
                    <span class="month-name">April</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="overview.html" class="month-card">
                    <span class="month-name">May</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="overview.html" class="month-card">
                    <span class="month-name">June</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="overview.html" class="month-card active-month">
                    <span class="month-name">July</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="overview.html" class="month-card">
                    <span class="month-name">August</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="overview.html" class="month-card">
                    <span class="month-name">September</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="overview.html" class="month-card">
                    <span class="month-name">October</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="overview.html" class="month-card">
                    <span class="month-name">November</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <a href="overview.html" class="month-card">
                    <span class="month-name">December</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
            </div>
        </section>
    </main>

</body>
</html>
