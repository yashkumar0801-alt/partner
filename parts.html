<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spare Parts</title>
    <link rel="stylesheet" href="parts.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Floating Back Button -->
    <a href="home.html" class="floating-back-btn" aria-label="Go Back">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

            <h1 class="page-title">SPARE PARTS</h1>

        <section class="parts-grid-section">

                    </div>
                    <div class="part-details">
                        <h3 class="part-name">Screwdriver</h3>
                        <button class="btn-solid btn-full"><i class="fa-solid fa-cart-plus"></i> Request</button>
                    </div>
                </div>
